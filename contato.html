<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RD IMPORTS | Contato</title>
    <!-- Ícones Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* RESET E VARIÁVEIS DE CORES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        :root {
            --bg-black: #0d0d0d;
            --card-black: #1a1a1a;
            --neon-yellow: #ccff00;
            --text-light: #f5f5f5;
            --text-gray: #a1a1a1;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* CABEÇALHO / NAVBAR */
        header {
            background-color: #000000;
            border-bottom: 2px solid var(--neon-yellow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--neon-yellow);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-style: italic;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .nav-links a.active,
        .nav-links a:hover {
            color: var(--neon-yellow);
        }

        /* CONTAINER DE CONTATO CENTRALIZADO */
        .contact-container {
            max-width: 600px;
            margin: auto;
            padding: 2rem 1.5rem;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .contact-card {
            background-color: var(--card-black);
            border: 2px solid var(--neon-yellow);
            border-radius: 12px;
            padding: 3rem 2rem;
            width: 100%;
            box-shadow: 0 5px 20px rgba(204, 255, 0, 0.1);
        }

        .contact-icon {
            font-size: 3.5rem;
            color: var(--neon-yellow);
            margin-bottom: 1.5rem;
        }

        .contact-card h1 {
            font-size: 2rem;
            text-transform: uppercase;
            font-weight: 900;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .contact-card p {
            color: var(--text-gray);
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }

        .email-box {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: #000000;
            border: 1px solid var(--neon-yellow);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--neon-yellow);
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .email-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(204, 255, 0, 0.2);
        }

        /* RESPONSIVIDADE */
        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                gap: 1rem;
            }
            .email-box {
                font-size: 1rem;
                padding: 0.8rem 1rem;
            }
        }

        /* RODAPÉ */
        footer {
            background-color: #000000;
            padding: 2rem 0;
            margin-top: 4rem;
            border-top: 1px solid #222;
            text-align: center;
            color: var(--text-gray);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">RLG IMPORTS</a>
            <ul class="nav-links">
                <li><a href="./index2.html">Início</a></li>
                <li><a href="./contato.html" class="active">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTEÚDO DE CONTATO -->
    <main class="contact-container">
        <div class="contact-card">
            <div class="contact-icon">
                <i class="fa-solid fa-envelope"></i>
            </div>
            <h1>Fale Conosco</h1>
            <p>Dúvidas, suporte ou informações sobre pedidos? Entre em contato pelo nosso e-mail abaixo:</p>
            <a href="mailto:contato@rdimports.com.br" class="email-box">
                <i class="fa-regular fa-paper-plane"></i> rodrigorigolingodoyfilho@gmail.com
            </a>
        </div>
    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>&copy; 2026 RLG IMPORTS - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
